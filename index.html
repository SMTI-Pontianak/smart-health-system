<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Health System - SMK-SMTI Pontianak</title>
    <meta name="description" content="Medical history recording system for SMK-SMTI Pontianak healthcare facility.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>SMK-SMTI Pontianak</h2>
                <p>Smart Health System</p>
            </div>
            <nav class="sidebar-nav">
                <a href="#" class="active" id="nav-add">New Record</a>
                <a href="#" id="nav-view">View Records</a>
            </nav>
            <div class="sidebar-footer">
                <button id="btn-reset-db" class="btn-danger">Clear Database</button>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <h1 id="page-title">Medical History Form</h1>
            </header>

            <div id="view-section" class="content-section" style="display: none;">
                <div class="glass-card">
                    <div class="table-actions">
                        <h3>Saved Records (SQL Database)</h3>
                    </div>
                    <div class="table-responsive">
                        <table id="records-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Name</th>
                                    <th>Age</th>
                                    <th>Gender</th>
                                    <th>Blood Pressure</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="records-tbody">
                                <!-- Records will be loaded here -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div id="form-section" class="content-section">
                <form id="health-form" class="glass-card">

                    <!-- Section 1: Personal Information -->
                    <div class="form-section">
                        <h2 class="section-title">Personal Information</h2>
                        <div class="form-grid">
                            <div class="form-group">
                                <label for="name">Full Name</label>
                                <input type="text" id="name" required placeholder="John Doe">
                            </div>
                            <div class="form-group">
                                <label for="placeOfBirth">Place of Birth</label>
                                <input type="text" id="placeOfBirth" required placeholder="Pontianak">
                            </div>
                            <div class="form-group">
                                <label for="dateOfBirth">Date of Birth</label>
                                <input type="date" id="dateOfBirth" required>
                            </div>
                            <div class="form-group">
                                <label for="age">Age</label>
                                <input type="number" id="age" required placeholder="16" min="10" max="100">
                            </div>
                            <div class="form-group">
                                <label for="gender">Gender</label>
                                <select id="gender" required>
                                    <option value="" disabled selected>Select Gender</option>
                                    <option value="Male">Male</option>
                                    <option value="Female">Female</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Section 2: Medical History -->
                    <div class="form-section">
                        <h2 class="section-title">Medical History</h2>
                        <div class="form-grid">
                            <div class="form-group full-width">
                                <label for="allergies">Allergies</label>
                                <input type="text" id="allergies"
                                    placeholder="e.g. Peanuts, Penicillin (Leave empty if none)">
                            </div>
                            <div class="form-group full-width">
                                <label for="injuries">Past Severe Injuries</label>
                                <input type="text" id="injuries"
                                    placeholder="e.g. Broken right arm 2019 (Leave empty if none)">
                            </div>
                            <div class="form-group">
                                <label for="seizures">Past Seizures</label>
                                <select id="seizures" required>
                                    <option value="No">No</option>
                                    <option value="Yes">Yes</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="transfusions">Past Blood Transfusions</label>
                                <select id="transfusions" required>
                                    <option value="No">No</option>
                                    <option value="Yes">Yes</option>
                                </select>
                            </div>
                            <div class="form-group full-width">
                                <label for="congenital">Congenital Diseases</label>
                                <input type="text" id="congenital" placeholder="Any congenital diseases...">
                            </div>
                            <div class="form-group full-width">
                                <label for="otherSymptoms">Other Diseases or Symptoms</label>
                                <textarea id="otherSymptoms" rows="2"
                                    placeholder="Mention any other symptoms..."></textarea>
                            </div>
                            <div class="form-group full-width">
                                <label for="vaccinations">Vaccination History</label>
                                <input type="text" id="vaccinations" placeholder="e.g. COVID-19, Polio...">
                            </div>
                        </div>
                    </div>

                    <!-- Section 3: Family History -->
                    <div class="form-section">
                        <h2 class="section-title">Family History</h2>
                        <div class="form-grid">
                            <div class="form-group">
                                <label for="famTb">Tuberculosis (TB)</label>
                                <select id="famTb" required>
                                    <option value="No">No</option>
                                    <option value="Yes">Yes</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="famDiabetes">Diabetes</label>
                                <select id="famDiabetes" required>
                                    <option value="No">No</option>
                                    <option value="Yes">Yes</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="famHep">Hepatitis</label>
                                <select id="famHep" required>
                                    <option value="No">No</option>
                                    <option value="Yes">Yes</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="famAsthma">Asthma</label>
                                <select id="famAsthma" required>
                                    <option value="No">No</option>
                                    <option value="Yes">Yes</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Section 4: Physical Checkup -->
                    <div class="form-section">
                        <h2 class="section-title">Physical Checkup & Vitals</h2>
                        <div class="form-grid">
                            <div class="form-group">
                                <label for="height">Height (cm)</label>
                                <input type="number" step="0.1" id="height" required placeholder="170">
                            </div>
                            <div class="form-group">
                                <label for="weight">Weight (kg)</label>
                                <input type="number" step="0.1" id="weight" required placeholder="60">
                            </div>
                            <div class="form-group">
                                <label for="bp">Blood Pressure (mmHg)</label>
                                <input type="text" id="bp" required placeholder="120/80">
                            </div>
                            <div class="form-group">
                                <label for="hr">Heart Rate (bpm)</label>
                                <input type="number" id="hr" required placeholder="75">
                            </div>
                            <div class="form-group">
                                <label for="temp">Body Temperature (°C)</label>
                                <input type="number" step="0.1" id="temp" required placeholder="36.5">
                            </div>
                        </div>
                    </div>

                    <!-- Section 5: Remarks -->
                    <div class="form-section">
                        <h2 class="section-title">Remarks (Optional)</h2>
                        <div class="form-group full-width">
                            <label for="remarks">Additional Healthcare Staff Remarks</label>
                            <textarea id="remarks" rows="3" placeholder="Any additional notes..."></textarea>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="button" id="btn-pdf" class="btn-secondary">Export to PDF</button>
                        <button type="submit" id="btn-save" class="btn-primary">Save to Database</button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <!-- SQL.js for handling SQLite in-browser -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
    <!-- jsPDF for PDF generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

    <script src="app.js"></script>
</body>

</html>
