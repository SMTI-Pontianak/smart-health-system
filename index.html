<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Health System - SMK-SMTI Pontianak</title>
    <meta name="description" content="Sistem pencatatan riwayat medis untuk fasilitas kesehatan SMK-SMTI Pontianak.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>SMK-SMTI Pontianak</h2>
                <p>Sistem Kesehatan Cerdas</p>
            </div>
            <nav class="sidebar-nav">
                <a href="#" class="active" id="nav-add">Catatan Baru</a>
                <a href="#" id="nav-view">Lihat Catatan</a>
            </nav>
            <div class="sidebar-footer">
                <button id="btn-reset-db" class="btn-danger">Hapus Database</button>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <h1 id="page-title">Formulir Riwayat Medis</h1>
            </header>

            <div id="view-section" class="content-section" style="display: none;">
                <div class="glass-card">
                    <div class="table-actions">
                        <h3>Catatan Tersimpan (Database SQL)</h3>
                    </div>
                    <div class="table-responsive">
                        <table id="records-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Nama</th>
                                    <th>Umur</th>
                                    <th>Jenis Kelamin</th>
                                    <th>Tekanan Darah</th>
                                    <th>Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="records-tbody">
                                <!-- Records will be loaded here -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div id="form-section" class="content-section">
                <form id="health-form" class="glass-card">

                    <!-- Section 1: Personal Information -->
                    <div class="form-section">
                        <h2 class="section-title">Informasi Pribadi</h2>
                        <div class="form-grid">
                            <div class="form-group">
                                <label for="name">Nama Lengkap</label>
                                <input type="text" id="name" required placeholder="John Doe">
                            </div>
                            <div class="form-group">
                                <label for="placeOfBirth">Tempat Lahir</label>
                                <input type="text" id="placeOfBirth" required placeholder="Pontianak">
                            </div>
                            <div class="form-group">
                                <label for="dateOfBirth">Tanggal Lahir</label>
                                <input type="date" id="dateOfBirth" required>
                            </div>
                            <div class="form-group">
                                <label for="age">Umur</label>
                                <input type="number" id="age" required placeholder="16" min="10" max="100">
                            </div>
                            <div class="form-group">
                                <label for="gender">Jenis Kelamin</label>
                                <select id="gender" required>
                                    <option value="" disabled selected>Pilih Jenis Kelamin</option>
                                    <option value="Male">Laki-laki</option>
                                    <option value="Female">Perempuan</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Section 2: Medical History -->
                    <div class="form-section">
                        <h2 class="section-title">Riwayat Medis</h2>
                        <div class="form-grid">
                            <div class="form-group full-width">
                                <label for="allergies">Alergi</label>
                                <input type="text" id="allergies"
                                    placeholder="mis. Kacang, Penisilin (Kosongkan jika tidak ada)">
                            </div>
                            <div class="form-group full-width">
                                <label for="injuries">Cedera Parah Sebelumnya</label>
                                <input type="text" id="injuries"
                                    placeholder="mis. Patah lengan kanan 2019 (Kosongkan jika tidak ada)">
                            </div>
                            <div class="form-group">
                                <label for="seizures">Riwayat Kejang</label>
                                <select id="seizures" required>
                                    <option value="No">Tidak</option>
                                    <option value="Yes">Ya</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="transfusions">Riwayat Transfusi Darah</label>
                                <select id="transfusions" required>
                                    <option value="No">Tidak</option>
                                    <option value="Yes">Ya</option>
                                </select>
                            </div>
                            <div class="form-group full-width">
                                <label for="congenital">Penyakit Bawaan</label>
                                <input type="text" id="congenital" placeholder="Penyakit bawaan apa pun...">
                            </div>
                            <div class="form-group full-width">
                                <label for="otherSymptoms">Penyakit atau Gejala Lainnya</label>
                                <textarea id="otherSymptoms" rows="2"
                                    placeholder="Sebutkan gejala lainnya..."></textarea>
                            </div>
                            <div class="form-group full-width">
                                <label for="vaccinations">Riwayat Vaksinasi</label>
                                <input type="text" id="vaccinations" placeholder="mis. COVID-19, Polio...">
                            </div>
                        </div>
                    </div>

                    <!-- Section 3: Family History -->
                    <div class="form-section">
                        <h2 class="section-title">Riwayat Keluarga</h2>
                        <div class="form-grid">
                            <div class="form-group">
                                <label for="famTb">Tuberkulosis (TBC)</label>
                                <select id="famTb" required>
                                    <option value="No">Tidak</option>
                                    <option value="Yes">Ya</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="famDiabetes">Diabetes</label>
                                <select id="famDiabetes" required>
                                    <option value="No">Tidak</option>
                                    <option value="Yes">Ya</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="famHep">Hepatitis</label>
                                <select id="famHep" required>
                                    <option value="No">Tidak</option>
                                    <option value="Yes">Ya</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="famAsthma">Asma</label>
                                <select id="famAsthma" required>
                                    <option value="No">Tidak</option>
                                    <option value="Yes">Ya</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Section 4: Physical Checkup -->
                    <div class="form-section">
                        <h2 class="section-title">Pemeriksaan Fisik & Tanda Vital</h2>
                        <div class="form-grid">
                            <div class="form-group">
                                <label for="height">Tinggi Badan (cm)</label>
                                <input type="number" step="0.1" id="height" required placeholder="170">
                            </div>
                            <div class="form-group">
                                <label for="weight">Berat Badan (kg)</label>
                                <input type="number" step="0.1" id="weight" required placeholder="60">
                            </div>
                            <div class="form-group">
                                <label for="bp">Tekanan Darah (mmHg)</label>
                                <input type="text" id="bp" required placeholder="120/80">
                            </div>
                            <div class="form-group">
                                <label for="hr">Denyut Jantung (bpm)</label>
                                <input type="number" id="hr" required placeholder="75">
                            </div>
                            <div class="form-group">
                                <label for="temp">Suhu Tubuh (°C)</label>
                                <input type="number" step="0.1" id="temp" required placeholder="36.5">
                            </div>
                        </div>
                    </div>

                    <!-- Section 5: Remarks -->
                    <div class="form-section">
                        <h2 class="section-title">Catatan Tambahan (Opsional)</h2>
                        <div class="form-group full-width">
                            <label for="remarks">Catatan Tambahan Staf Kesehatan</label>
                            <textarea id="remarks" rows="3" placeholder="Catatan tambahan apa pun..."></textarea>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="button" id="btn-pdf" class="btn-secondary">Ekspor ke PDF</button>
                        <button type="submit" id="btn-save" class="btn-primary">Simpan ke Database</button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <!-- SQL.js for handling SQLite in-browser -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
    <!-- jsPDF for PDF generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

    <script src="app.js"></script>
</body>

</html>
